name: Sync verified KPM artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifest.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hub
        uses: actions/checkout@v4

      - name: Download source artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/ktm/artifacts packages/korean-crossword/artifacts packages/korean-ime-probe/artifacts packages/korean-ime/artifacts packages/bluetooth-keymap-toggle/artifacts checksums

          curl -fL --retry 3 -o packages/ktm/artifacts/ktm_0.1.16_kindlehf.kpkg \
            https://raw.githubusercontent.com/kindle-lab/ktm/main/packages/ktm/artifacts/ktm_0.1.16_kindlehf.kpkg

          fetch_release_or_keep() {
            local url="$1"
            local dest="$2"
            local tmp="${dest}.download"
            if curl -fL --retry 3 -o "$tmp" "$url"; then
              mv "$tmp" "$dest"
            else
              rm -f "$tmp"
              if [ -s "$dest" ]; then
                echo "Release asset unavailable; keeping existing verified mirror: $dest"
              else
                echo "Release asset unavailable and no verified mirror exists: $dest" >&2
                exit 1
              fi
            fi
          }

          fetch_release_or_keep \
            https://github.com/kindle-lab/kindle-crossword/releases/download/v0.1.0/korean-crossword-kindlehf.kpkg \
            packages/korean-crossword/artifacts/korean-crossword_0.1.0_kindlehf.kpkg

          fetch_release_or_keep \
            https://github.com/kindle-lab/kindle-korean-ime/releases/download/v0.6.5/korean-ime-probe_0.2.5_kindlehf-kindlepw2.kpkg \
            packages/korean-ime-probe/artifacts/korean-ime-probe_0.2.5_kindlehf-kindlepw2.kpkg

          fetch_release_or_keep \
            https://github.com/kindle-lab/kindle-korean-ime/releases/download/v0.6.5/korean-ime_0.6.5_kindlehf-kindlepw2.kpkg \
            packages/korean-ime/artifacts/korean-ime_0.6.5_kindlehf-kindlepw2.kpkg

          curl -fL --retry 3 -o packages/bluetooth-keymap-toggle/artifacts/bluetooth-keymap-toggle_1.0.7_kindlehf-kindlepw2.kpkg \
            https://raw.githubusercontent.com/kindle-lab/kbt/main/packages/bluetooth-keymap-toggle/artifacts/bluetooth-keymap-toggle_1.0.7_kindlehf-kindlepw2.kpkg

          sha256sum packages/*/artifacts/*.kpkg > checksums/SHA256SUMS

      - name: Validate manifest paths
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text())
          for package in manifest["packages"].values():
              for artifact in package["artifacts"]:
                  path = Path(artifact["url"])
                  if not path.is_file():
                      raise SystemExit(f"Missing manifest artifact: {path}")
          print("manifest paths valid")
          PY

      - name: Commit synchronized artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json packages checksums
          if git diff --cached --quiet; then
            echo "No synchronization changes"
          else
            git commit -m "Sync verified KPM artifacts"
            git push
          fi
